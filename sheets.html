<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Sheets Viewer - Site Inspector</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .sheet-container {
      max-width: 100%;
      overflow: auto;
      margin: 10px 0;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
    }
    
    .sheet-iframe {
      width: 100%;
      border: none;
      min-height: 500px;
    }
    
    .sheet-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .sheet-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .sheet-item:hover {
      background-color: var(--surface);
    }
    
    .sheet-item.active {
      background-color: var(--surface-hover);
      border-left: 3px solid #1a73e8;
    }
    
    .back-button {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: var(--surface-hover);
      border: 1px solid #dadce0;
      border-radius: 4px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 15px;
    }
    
    .back-button:hover {
      background: var(--border);
    }

    /* Dark theme support */
    @media (prefers-color-scheme: dark) {
      .sheet-container {
        border: 1px solid var(--border);
      }
      
      .sheet-item {
        border-bottom: 1px solid var(--border);
        color: var(--text-primary);
      }
      
      .sheet-item:hover {
        background-color: var(--surface-hover);
      }
      
      .sheet-item.active {
        background-color: var(--surface-hover);
        border-left: 3px solid var(--primary-color);
      }
      
      .back-button {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      
      .back-button:hover {
        background: var(--surface-hover);
      }
      
      h1, h2 {
        color: var(--text-primary);
      }
      
      .empty-state {
        color: var(--text-secondary);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" id="back-button" class="back-button">← Back to Inspector</a>
    <h1>Google Sheets Viewer</h1>
    
    <div id="sheets-list" class="section">
      <h2>Available Sheets</h2>
      <div id="sheets-container" class="items-container">
        <div class="empty-state">Loading sheets...</div>
      </div>
    </div>
    
    <div id="sheet-viewer" class="section" style="display: none;">
      <h2>Viewing: <span id="current-sheet"></span></h2>
      <div class="sheet-container">
        <iframe id="sheet-frame" class="sheet-iframe"></iframe>
      </div>
    </div>
  </div>

  <script src="sheets.js"></script>
</body>
</html>
