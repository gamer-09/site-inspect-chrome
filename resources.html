<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Page Resources - Site Inspector</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .resource-container {
      margin: 10px 0;
    }
    
    .resource-list {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 10px;
    }
    
    .resource-item {
      padding: 8px;
      margin: 4px 0;
      background: var(--surface);
      border-radius: 4px;
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      border-left: 3px solid #1a73e8;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .resource-item:hover {
      background-color: var(--surface-hover);
    }
    
    .back-button {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: var(--surface-hover);
      border: 1px solid #dadce0;
      border-radius: 4px;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 15px;
    }
    
    .back-button:hover {
      background: var(--border);
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section h2 {
      font-size: 14px;
      color: #1a73e8;
      margin: 10px 0 5px 0;
    }
    
    .count {
      font-weight: normal;
      color: #5f6368;
    }

    .container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 18px;
      color: var(--text-primary);
      margin: 0 0 15px 0;
    }

    .empty-state {
      color: #5f6368;
      font-style: italic;
      padding: 10px;
      text-align: center;
    }

    /* Dark theme support */
    @media (prefers-color-scheme: dark) {
      .resource-list {
        border: 1px solid var(--border);
      }
      
      .resource-item {
        background: var(--surface);
        border-left: 3px solid var(--primary-color);
        color: var(--text-primary);
      }
      
      .resource-item:hover {
        background-color: var(--surface-hover);
      }
      
      .back-button {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      
      .back-button:hover {
        background: var(--surface-hover);
      }
      
      .section h2 {
        color: var(--primary-color);
      }
      
      .count {
        color: var(--text-secondary);
      }
      
      h1 {
        color: var(--text-primary);
      }
      
      .empty-state {
        color: var(--text-secondary);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" id="back-button" class="back-button">← Back to Inspector</a>
    <h1>Page Resources</h1>
    
    <div class="section">
      <h2>Scripts <span id="script-count" class="count">(0)</span></h2>
      <div id="scripts-container" class="resource-list">
        <div class="empty-state">No scripts found</div>
      </div>
    </div>
    
    <div class="section">
      <h2>Stylesheets <span id="stylesheet-count" class="count">(0)</span></h2>
      <div id="stylesheets-container" class="resource-list">
        <div class="empty-state">No stylesheets found</div>
      </div>
    </div>
  </div>

  <script src="resources.js"></script>
</body>
</html>
